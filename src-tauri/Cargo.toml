[package]
name = "ghostcue"
version = "0.1.0"
description = "Stealth uncapturable desktop HUD AI interview assistant"
authors = ["GhostCue Contributors"]
edition = "2021"
default-run = "ghostcue"

[lib]
name = "ghostcue_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }

[dependencies]
tauri = { version = "2.2.4", features = ["tray-icon"] }
tauri-plugin-shell = "2.2.0"
tauri-plugin-store = "2.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
cpal = "0.15.3"
hound = "3.5.1"
reqwest = { version = "0.12.12", features = ["json", "stream", "multipart"] }
futures-util = "0.3.31"
log = "0.4.25"
env_logger = "0.11.6"
crossbeam-channel = "0.5.14"
parking_lot = "0.12.3"
uuid = { version = "1.13", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
rfd = "0.15"


[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_Threading"
] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
