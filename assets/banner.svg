<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.1" />
    </linearGradient>

    <!-- Brand Typography Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e0f2fe" />
      <stop offset="70%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#a5b4fc" />
    </linearGradient>

    <linearGradient id="ghostGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Atmospheric Glow Filters -->
    <filter id="glowCyan" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="36" result="blur" />
    </filter>
    <filter id="glowIndigo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="2" y="2" width="1196" height="276" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Ambient Light Orbs -->
  <circle cx="160" cy="140" r="90" fill="#0284c7" opacity="0.18" filter="url(#glowCyan)" />
  <circle cx="1020" cy="130" r="110" fill="#6366f1" opacity="0.16" filter="url(#glowIndigo)" />

  <!-- Subtle High-Tech Grid Pattern -->
  <g opacity="0.07" stroke="#38bdf8" stroke-width="0.8">
    <line x1="80" y1="50" x2="1120" y2="50" />
    <line x1="80" y1="110" x2="1120" y2="110" />
    <line x1="80" y1="170" x2="1120" y2="170" />
    <line x1="80" y1="230" x2="1120" y2="230" />
    <line x1="260" y1="20" x2="260" y2="260" />
    <line x1="600" y1="20" x2="600" y2="260" />
    <line x1="940" y1="20" x2="940" y2="260" />
  </g>

  <!-- Logo Mark Container -->
  <g transform="translate(90, 85)">
    <!-- Glow Backdrop -->
    <circle cx="50" cy="50" r="50" fill="#0369a1" opacity="0.25" filter="url(#glowCyan)" />
    <!-- Ghost Shape -->
    <path d="M50 12C32.327 12 18 26.327 18 44V78C18 80.5 20.5 82 22.8 80.8L32 76L41.2 80.8C43.5 82 46.5 82 48.8 80.8L50 80.2L51.2 80.8C53.5 82 56.5 82 58.8 80.8L68 76L77.2 80.8C79.5 82 82 80.5 82 78V44C82 26.327 67.673 12 50 12Z" fill="url(#ghostGrad)" />
    <!-- Eyes -->
    <circle cx="38" cy="40" r="5" fill="#0b1120"/>
    <circle cx="62" cy="40" r="5" fill="#0b1120"/>
    <circle cx="40" cy="38" r="1.8" fill="#38bdf8"/>
    <circle cx="64" cy="38" r="1.8" fill="#38bdf8"/>
    <!-- Subtle smile -->
    <path d="M42 56C44.5 59 55.5 59 58 56" stroke="#0b1120" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Typography Content -->
  <!-- Title -->
  <text x="230" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="4" fill="url(#textGrad)">
    GHOSTCUE
  </text>

  <!-- Subtitle -->
  <text x="234" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500" letter-spacing="1.5" fill="#94a3b8">
    UNDETECTABLE DESKTOP AI COPILOT &amp; MULTI-MODEL SPEECH INTELLIGENCE
  </text>

  <!-- Feature Pills / Badges -->
  <g transform="translate(234, 182)">
    <!-- Pill 1: Rust & Tauri v2 -->
    <rect x="0" y="0" width="138" height="28" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="14" cy="14" r="3.5" fill="#38bdf8" />
    <text x="26" y="18" font-family="monospace" font-size="11" font-weight="600" fill="#e2e8f0">Rust + Tauri v2</text>

    <!-- Pill 2: WASAPI Loopback -->
    <rect x="148" y="0" width="158" height="28" rx="6" fill="#0f172a" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="162" cy="14" r="3.5" fill="#818cf8" />
    <text x="174" y="18" font-family="monospace" font-size="11" font-weight="600" fill="#e2e8f0">WASAPI Loopback</text>

    <!-- Pill 3: Anti-Capture -->
    <rect x="316" y="0" width="168" height="28" rx="6" fill="#0f172a" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="330" cy="14" r="3.5" fill="#a855f7" />
    <text x="342" y="18" font-family="monospace" font-size="11" font-weight="600" fill="#e2e8f0">Anti-Capture Guard</text>

    <!-- Pill 4: Local Whisper & Cloud -->
    <rect x="494" y="0" width="176" height="28" rx="6" fill="#0f172a" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="508" cy="14" r="3.5" fill="#10b981" />
    <text x="520" y="18" font-family="monospace" font-size="11" font-weight="600" fill="#e2e8f0">Local Whisper &amp; Cloud</text>

    <!-- Pill 5: Multi-LLM -->
    <rect x="680" y="0" width="194" height="28" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="694" cy="14" r="3.5" fill="#f59e0b" />
    <text x="706" y="18" font-family="monospace" font-size="11" font-weight="600" fill="#e2e8f0">Multi-Model Streaming</text>
  </g>
</svg>
